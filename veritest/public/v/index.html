<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex">
<title>Veritest · Verificación de diploma</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f766e'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/veritest.css">
</head>
<body data-page="record">
<div class="wrap">
  <header class="top">
    <a class="brand" href="/">Veri<span>test</span></a>
    <span class="tag">Verificación de diploma</span>
  </header>

  <main>
    <section class="card" aria-labelledby="h-rec">
      <h2 id="h-rec">Registro del diploma</h2>
      <div id="result" aria-live="polite">Consultando el registro…</div>
    </section>

    <section class="card" aria-labelledby="h-file">
      <h2 id="h-file">¿Tienes el archivo PDF?</h2>
      <p class="small">Súbelo para comprobar que es idéntico al registrado. No se sube: tu navegador calcula su huella y solo esa huella se consulta.</p>
      <label class="drop" id="drop" for="file">
        <input id="file" type="file" accept="application/pdf,.pdf">
        <strong>Elegir un PDF</strong> o soltarlo aquí
      </label>
      <div id="file-status" role="status" aria-live="polite" class="small"></div>
      <div id="file-result" aria-live="polite"></div>
    </section>
  </main>

  <footer>Veritest · <a href="/">Verificar otro diploma</a></footer>
</div>
<script src="/js/verify.js"></script>
</body>
</html>
