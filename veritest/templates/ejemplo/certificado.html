<!doctype html>
<html lang="es">
<meta charset="utf-8">
<title>Certificado de ejemplo</title>
<!--
  Plantilla NEUTRA de ejemplo para `veritest generate` (sin logos, firmas ni
  fotos de nadie). Recibe por query: n = nombre, t = título del diploma,
  f = folio. Cópiala y reemplaza el diseño por el tuyo.

  Regla para cualquier plantilla propia: dejar LIBRE una esquina de unos
  30 x 36 mm donde Veritest pega su tarjeta con el QR (aquí, arriba a la
  derecha; en el CLI: --corner tr --margin-x 12 --margin-y 12). Veritest
  no puede ver qué hay debajo de la tarjeta, así que lo que pongas ahí queda
  tapado.
-->
<style>
@page { size: 297mm 210mm; margin: 0 }
* { box-sizing: border-box; margin: 0 }
html, body { width: 297mm; height: 210mm; overflow: hidden }
body { position: relative; font-family: Georgia, 'Times New Roman', serif; color: #14213d; background: #fdfcf8 }
.frame { position: absolute; inset: 10mm; border: .6mm solid #14213d }
.frame:after { content: ""; position: absolute; inset: 2mm; border: .2mm solid #b08d3a }
.org { position: absolute; left: 24mm; top: 22mm; font: 500 3.4mm/1.3 Helvetica, Arial, sans-serif; letter-spacing: 1.2mm; color: #b08d3a }
h1 { position: absolute; left: 24mm; right: 70mm; top: 62mm; font-size: 17mm; font-weight: 400; line-height: 1.05 }
.lead { position: absolute; left: 24mm; top: 108mm; font: 4mm Helvetica, Arial, sans-serif; color: #555 }
.nm { position: absolute; left: 24mm; right: 24mm; top: 116mm; font-size: 14mm; font-style: italic; white-space: nowrap }
.ttl { position: absolute; left: 24mm; right: 24mm; top: 142mm; font: 5mm/1.5 Helvetica, Arial, sans-serif }
.foot { position: absolute; left: 24mm; bottom: 20mm; font: 3mm Helvetica, Arial, sans-serif; letter-spacing: .5mm; color: #666 }
</style>
<body>
<div class="frame"></div>
<div class="org">ORGANIZACIÓN EMISORA</div>
<h1>Certificado de participación</h1>
<div class="lead">Se certifica que</div>
<div class="nm" id="nm"></div>
<div class="ttl" id="ttl"></div>
<div class="foot">Folio <span id="folio"></span> · Verificable en veritest.cl</div>
<script>
const P = new URLSearchParams(location.search);
document.getElementById('nm').textContent = P.get('n') || '';
document.getElementById('ttl').textContent = P.get('t') || '';
document.getElementById('folio').textContent = P.get('f') || '';
const nm = document.getElementById('nm');
let fs = 14; const max = document.documentElement.clientWidth * 0.8;
while (nm.scrollWidth > max && fs > 8) { fs -= .5; nm.style.fontSize = fs + 'mm'; }
</script>
</body>
