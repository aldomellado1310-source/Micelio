name: CI

# Goal 4 del pool ReservaGo: "que sea imposible desplegar dejando una función
# fuera por olvido". Corre en cada push/PR:
#   1) checkDeployList.js -- falla si functions/index.js exporta algo que no
#      está en functions/deploy-list.json (el olvido real que dejó
#      createBooking congelado en 2026-08-23, ver CLAUDE.md).
#   2) node --test de functions/ (incluye el cross-check de goal 3).
#   3) tests de reglas (firestore.rules/storage.rules) contra el emulador de
#      Firestore.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias (raíz)
        run: npm ci

      - name: Instalar dependencias (functions/)
        run: npm ci
        working-directory: functions

      - name: Verificar functions/deploy-list.json contra functions/index.js
        run: npm run check:deploy-list

      - name: node --test (functions/, incluye el cross-check de solape)
        run: npm test
        working-directory: functions

      - name: Tests de reglas (Firestore emulator)
        run: npm run test:rules
